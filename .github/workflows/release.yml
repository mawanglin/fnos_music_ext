name: Release (native-only fork)

# 本 fork（native-only 分支）的发布流程：
#   - 只发 GitHub Release（原生 fpk，无 Docker），不回填 moo 索引、不发 Gitee；
#   - tag 形如 v<上游基线>-n<自有小版本>，如 v2.12.3-n1，由 VERSION(2.12.3-1) + RELEASE_CHANNEL(fork) 推导；
#   - 不要求 tag 合入 main：本分支永不合并 main（保持 main 可持续同步上游）。
on:
  push:
    tags: ["v*-n*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要（补）发布的 tag，如 v2.12.3-n1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # 打赏二维码文本（可选，fork 未配置 Secret 时自动跳过）
      ALIPAY_QRCODE: ${{ secrets.ALIPAY_QRCODE }}
      WECHAT_QRCODE: ${{ secrets.WECHAT_QRCODE }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Verify tag matches VERSION
        id: release-kind
        run: |
          python3 proxy/version.py --tag "$TAG" --github-output "$GITHUB_OUTPUT"

      - name: Require the fork release channel
        run: test "$(cat RELEASE_CHANNEL)" = "fork"

      - name: Verify official music compatibility record
        run: python3 scripts/check_music_compat.py

      - name: Run packaging tests
        run: |
          python -m pip install pytest qrcode pillow zxing-cpp PyYAML
          python -m pytest packaging/tests/

      - name: Download fnpack
        run: |
          curl -fsSL -o fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          chmod +x fnpack && sudo mv fnpack /usr/local/bin/fnpack
        env:
          FNPACK_VERSION: "1.2.3"

      # 二维码图片不入库：按各自 Secret 独立生成，未配置的渠道在 WebUI 隐藏。
      # 微信中心复用 FPK 图标，不需要中文字体。
      - name: Install donation QR dependencies (optional)
        if: env.ALIPAY_QRCODE != '' || env.WECHAT_QRCODE != ''
        run: python3 -m pip install --quiet qrcode pillow

      - name: Install CJK font for QR badge (best-effort)
        if: env.ALIPAY_QRCODE != ''
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk || true

      - name: Generate Alipay QR code (optional)
        if: env.ALIPAY_QRCODE != ''
        run: |
          python3 scripts/gen_alipay_qr.py
          test -s webui-service/static/alipay.png

      - name: Generate WeChat QR code (optional)
        if: env.WECHAT_QRCODE != ''
        run: |
          python3 scripts/gen_wechat_qr.py
          test -s webui-service/static/wechat.png

      - name: Build fpk package
        run: |
          ./packaging/fpk/build.sh
          ls -la dist/

      - name: Verify donation assets in fpk
        run: |
          for fpk_file in dist/fnmusic-ext-*.fpk; do
            python3 scripts/check_donate_assets.py "$fpk_file"
          done

      - name: Verify the fpks (x86 + arm) are self-contained and Docker-free
        run: |
          ver="$(python3 proxy/version.py --format version)"
          for arch in x86 arm; do
            fpk_file="dist/fnmusic-ext-${ver}-${arch}.fpk"
            test -s "$fpk_file" && test -s "${fpk_file}.sha256"
            work="$(mktemp -d)"
            tar -xf "$fpk_file" -C "$work"
            grep -qx "platform              = ${arch}" "$work/manifest"
            mkdir -p "$work/app" && tar -xzf "$work/app.tgz" -C "$work/app"
            test -f "$work/app/repo/runtime/BUNDLED"
            test -x "$work/app/repo/runtime/python/bin/python3"
            test -x "$work/app/repo/runtime/ffmpeg/ffmpeg"
            test -x "$work/app/repo/runtime/site-sources/nodejs_wheel/bin/node"
            test -f "$work/app/repo/ensure_sources_native.sh"
            if find "$work/app" \( -name docker-compose.yml -o -name Dockerfile -o -name ensure_base_image.sh \) | grep -q .; then
              echo "${arch} fpk 不应包含 Docker 文件" >&2; exit 1
            fi
            want="x86-64"; [ "$arch" = arm ] && want="aarch64"
            for elf in python/bin/python3.13 site-sources/nodejs_wheel/bin/node ffmpeg/ffmpeg; do
              file -b "$work/app/repo/runtime/$elf" | grep -qi "$want" || { echo "$elf 不是 $want" >&2; exit 1; }
            done
            if [ -n "$(find "$work/app" -type l -lname '/*')" ]; then
              echo "${arch} fpk 内有绝对路径符号链接（飞牛会解压失败）" >&2; exit 1
            fi
            rm -rf "$work"
          done

      - name: Extract changelog for this version
        run: |
          version="${{ steps.release-kind.outputs.display_version }}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "CHANGELOG.md 中未找到 ## [$version] 段落" >&2
            exit 1
          fi
          head -5 /tmp/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${TAG#v}"
          title="fnmusic-ext ${ver}（原生版，x86 + arm 各一个包，内置运行时）"
          assets=(dist/fnmusic-ext-*.fpk dist/fnmusic-ext-*.fpk.sha256)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --draft=false --title "$title" --notes-file /tmp/release-notes.md --prerelease=false --latest
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            gh release create "${TAG}" \
              --title "$title" \
              --notes-file /tmp/release-notes.md \
              --latest \
              "${assets[@]}"
          fi
