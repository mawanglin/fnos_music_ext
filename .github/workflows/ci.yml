name: CI

on:
  push:
    branches: [main, dev, v2.9.0, native-only]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = 已验证的最低支持版本；3.13 = 与生产 Docker 镜像一致
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # WebUI 的 pytest 包装器执行 Node 行为测试；不要再单独执行同一 JS 套件。
      # 显式安装 node，避免 runner 镜像变化后静默 skip。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install audio and proxy test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg nginx

      - name: Install test dependencies
        run: >
          python -m pip install -r proxy/requirements.txt
          -r webui-service/requirements.txt
          pytest pytest-asyncio mutagen qrcode pillow zxing-cpp PyYAML pytest-cov

      - name: Shell script syntax check
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')

      - name: Python compile check
        run: >
          python -m py_compile proxy/app.py proxy/recommend.py proxy/publicplaylists.py proxy/env_merge.py proxy/version.py
          lxmusic-service/app.py lxmusic-service/lxserver_client.py lxmusic-service/verify_source.py
          musicdl-service/app.py musicdl-service/hardening.py
          musicbox-service/app.py musicbox-service/runner.py musicbox-service/netease_ext.py musicbox-service/playback.py
          webui-service/app.py

      - name: Verify official music compatibility record
        run: python scripts/check_music_compat.py

      # 服务各用独立解释器，避免 app/conftest/环境变量污染；仅服务之间限2并行。
      # proxy/socket/部署与打包用例保守串行；覆盖率跨进程合并，仅展示不设门槛。
      - name: Run tests
        run: python scripts/run_tests.py --jobs 2 --coverage

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck errors
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck -S error
          # fpk 生命周期脚本（无 .sh 后缀）同样纳入检查
          git ls-files -z 'packaging/fpk/cmd/*' | xargs -0 shellcheck -S error

  fpk:
    runs-on: ubuntu-latest
    env:
      # secrets 不能用于 steps.if，先映射到 job 级 env（同 release.yml GITEE_TOKEN 模式）
      ALIPAY_QRCODE: ${{ secrets.ALIPAY_QRCODE }}
      WECHAT_QRCODE: ${{ secrets.WECHAT_QRCODE }}
    steps:
      - uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          curl -fsSL -o fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          chmod +x fnpack && sudo mv fnpack /usr/local/bin/fnpack
        env:
          FNPACK_VERSION: "1.2.3"

      # 二维码图片不入库：按各自 Secret 独立生成，未配置的渠道在 WebUI 隐藏。
      # 微信中心复用 FPK 图标，不需要中文字体。
      - name: Install donation QR dependencies (optional)
        if: env.ALIPAY_QRCODE != '' || env.WECHAT_QRCODE != ''
        run: python3 -m pip install --quiet qrcode pillow

      - name: Install CJK font for QR badge (best-effort)
        if: env.ALIPAY_QRCODE != ''
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk || true

      - name: Generate Alipay QR code (optional)
        if: env.ALIPAY_QRCODE != ''
        run: |
          python3 scripts/gen_alipay_qr.py
          test -s webui-service/static/alipay.png

      - name: Generate WeChat QR code (optional)
        if: env.WECHAT_QRCODE != ''
        run: |
          python3 scripts/gen_wechat_qr.py
          test -s webui-service/static/wechat.png

      - name: Build fpk package
        run: |
          ./packaging/fpk/build.sh
          ls -la dist/

      - name: Verify package artifacts (x86 + arm)
        run: |
          for arch in x86 arm; do
            fpk_file="dist/fnmusic-ext-$(python3 proxy/version.py --format version)-${arch}.fpk"
            test -s "$fpk_file"
            test -s "${fpk_file}.sha256"
            # fpk 为 tar.gz；app.tgz 承载 target/ 内容，应用骨架留在 fpk 顶层。
            for path in app.tgz cmd/main config/privilege config/resource \
              wizard/install manifest ICON.PNG ICON_256.PNG; do
              tar -tzf "$fpk_file" | grep -qx "$path" || {
                echo "ERROR: ${arch} fpk 缺少顶层 $path" >&2; exit 1; }
            done
            app_tmp="$(mktemp -d)"
            tar -xzf "$fpk_file" -C "$app_tmp" app.tgz manifest
            grep -qx "platform              = ${arch}" "$app_tmp/manifest" || {
              echo "ERROR: ${arch} fpk 的 manifest platform 不对" >&2; exit 1; }
            for path in ui/config ui/images/icon_64.png ui/images/icon_256.png \
              config/privilege config/resource repo/proxy/llm_usage.py repo/FNMUSIC_COMPAT.json \
              repo/runtime/BUNDLED repo/runtime/python/bin/python3 repo/runtime/ffmpeg/ffmpeg \
              repo/runtime/site-sources/nodejs_wheel/bin/node repo/ensure_sources_native.sh; do
              tar -tzf "$app_tmp/app.tgz" | grep -qx "$path" || {
                echo "ERROR: ${arch} app.tgz 缺少 $path" >&2; exit 1; }
            done
            # native-only：包内不得有 Docker 文件
            if tar -tzf "$app_tmp/app.tgz" | grep -Ei '(^|/)(docker-compose\.yml|Dockerfile|ensure_base_image\.sh)$'; then
              echo "ERROR: ${arch} fpk 含 Docker 文件" >&2; exit 1
            fi
            # 架构自洽：ELF 头必须和包声明的架构一致
            tar -xzf "$app_tmp/app.tgz" -C "$app_tmp" repo/runtime/python/bin/python3.13 repo/runtime/site-sources/nodejs_wheel/bin/node
            want="x86-64"; [ "$arch" = arm ] && want="aarch64"
            for elf in repo/runtime/python/bin/python3.13 repo/runtime/site-sources/nodejs_wheel/bin/node; do
              file -b "$app_tmp/$elf" | grep -qi "$want" || { echo "ERROR: $elf 不是 $want" >&2; exit 1; }
            done
            rm -rf "$app_tmp"
            python3 scripts/check_donate_assets.py "$fpk_file"
            ( cd dist && sha256sum -c "$(basename "$fpk_file").sha256" )
          done


  production:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [musicdl, musicbox, lxmusic]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real production dependencies
        run: python -m pip install -r '${{ matrix.service }}-service/requirements.txt'
      - name: Offline dependency and CLI contract
        run: python tests/integration/production_contract.py '${{ matrix.service }}' --app-dir '${{ matrix.service }}-service'

  # amd64 镜像只在下方矩阵构建一次，复用它验证 musicdl 与洛雪。
  # 不再另起 images job 重建相同 Dockerfile/参数及重复跑非 root 契约。
  # 双架构真实运行验证：amd64 原生构建，arm64 走 QEMU 用户态模拟，构建与冒烟
  # 都在目标架构里执行——锁定 sha256 的 ARM64 原生模块必须能被 Node 真实加载，
  # lxserver/lxmusic 正常运行且 healthz 通过，不再只验"构建成功"。
